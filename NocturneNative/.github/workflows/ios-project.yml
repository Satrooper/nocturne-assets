name: Prepare unsigned iOS project
on:
  workflow_dispatch:
    inputs:
      apple_team_id:
        description: 'Your Apple team identifier (10 characters; this is NOT a password)'
        required: true
        type: string
permissions:
  contents: read
jobs:
  export:
    runs-on: macos-14
    timeout-minutes: 30
    env:
      GODOT_VERSION: 4.5.2
      APPLE_TEAM_ID: ${{ inputs.apple_team_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Download official Godot and matching export templates
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          curl --fail --location --retry 3 "$base/Godot_v${GODOT_VERSION}-stable_macos.universal.zip" -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP"
          curl --fail --location --retry 3 "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o "$RUNNER_TEMP/templates.zip"
          unzip -q "$RUNNER_TEMP/templates.zip" 'templates/ios.zip' -d "$RUNNER_TEMP/godot-templates"
          target="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$target"
          cp "$RUNNER_TEMP/godot-templates/templates/ios.zip" "$target/ios.zip"
      - name: Import, configure identity, and export Xcode project
        shell: bash
        run: |
          set -euo pipefail
          godot="$RUNNER_TEMP/Godot.app/Contents/MacOS/Godot"
          "$godot" --headless --editor --path . --import
          "$godot" --headless --path . --script res://tools/configure_ios.gd
          mkdir -p build/ios
          "$godot" --headless --path . --export-debug iOS build/ios/Nocturne.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Nocturne-unsigned-Xcode-project
          path: build/ios/
          if-no-files-found: error
          retention-days: 7
